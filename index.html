<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>J.A.R.V.I.S.</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#05070d;color:#7fdfff;font-family:-apple-system,sans-serif;text-align:center;padding:20px;box-sizing:border-box}
  #ring{width:160px;height:160px;border-radius:50%;border:4px solid #7fdfff;box-shadow:0 0 30px #7fdfff;transition:.15s}
  #ring.active{border-color:#ffb347;box-shadow:0 0 50px #ffb347}
  #ring.play{border-color:#ffb347;box-shadow:0 0 50px #ffb347;animation:pulse 1s infinite}
  @keyframes pulse{50%{transform:scale(1.08)}}
  button,label.btn{background:#0e2233;color:#7fdfff;border:1px solid #7fdfff;border-radius:12px;padding:14px 22px;font-size:17px}
  #status{font-size:18px;min-height:3em}
  #hint{font-size:13px;opacity:.6;min-height:1.5em}
  #meter{width:220px;height:8px;border-radius:4px;background:#0e2233;overflow:hidden;position:relative}
  #level{height:100%;width:0;background:#7fdfff}
  #mark{position:absolute;top:0;bottom:0;width:2px;background:#ffb347}
  #sensBox{font-size:14px;display:flex;flex-direction:column;gap:6px;align-items:center}
  input[type=range]{width:220px}
  input[type=file]{display:none}
</style>
</head>
<body>
  <div id="ring"></div>
  <div id="status">Wähle zuerst dein Lied</div>
  <div id="hint"></div>
  <div id="meter"><div id="level"></div><div id="mark"></div></div>
  <div id="sensBox">
    Empfindlichkeit
    <input type="range" id="sens" min="20" max="95" value="70">
  </div>
  <label class="btn" id="pick" for="file">🎵 Lied wählen</label>
  <input type="file" id="file" accept="audio/*">
  <button id="start" disabled>Start</button>
  <audio id="song" playsinline></audio>

<script>
const MIN_GAP = 150, MAX_GAP = 800, DEBOUNCE = 100; // ms zwischen den zwei Klatschern

const $ = id => document.getElementById(id);
const song = $("song"), statusEl = $("status"), hint = $("hint"), ring = $("ring");
let phase = "idle", ctx, stream, src, listenId = 0, wakeLock = null;
let threshold = 1 - $("sens").value / 100;

function updateMark() { $("mark").style.left = (threshold * 100) + "%"; }
$("sens").oninput = e => { threshold = 1 - e.target.value / 100; updateMark(); };
updateMark();

// iOS: "playback" = über Lautsprecher und auch im Stummmodus hörbar
function setSession(type) {
  try { if (navigator.audioSession) navigator.audioSession.type = type; } catch (e) {}
}

// Display wach halten, solange die Seite offen ist
async function keepAwake() {
  try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
}

$("file").onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  song.src = URL.createObjectURL(f);
  statusEl.textContent = "„" + f.name + "“ geladen – tippe auf Start";
  $("start").disabled = false;
};

$("start").onclick = async () => {
  // Audio für iOS freischalten (geht nur nach einem Tipp)
  setSession("playback");
  song.muted = true;
  try { await song.play(); } catch (e) {}
  song.pause(); song.currentTime = 0; song.muted = false;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume();
  keepAwake();
  $("start").style.display = "none";
  $("pick").style.display = "none";
  startListening();
};

ring.onclick = () => { // Tippen auf den Ring stoppt die Musik
  if (phase === "play") { song.pause(); startListening(); }
};
song.onended = () => { if (phase === "play") startListening(); };

async function startListening() {
  const id = ++listenId;
  phase = "listen";
  ring.className = "";
  statusEl.textContent = "👏👏 Zweimal klatschen";
  hint.textContent = "";
  setSession("play-and-record");
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
  } catch (e) {
    phase = "idle";
    statusEl.textContent = "Kein Mikrofonzugriff 😕 – Seite neu laden und erlauben";
    return;
  }
  await ctx.resume();
  src = ctx.createMediaStreamSource(stream);
  const an = ctx.createAnalyser();
  an.fftSize = 1024;
  src.connect(an);
  const buf = new Float32Array(an.fftSize);
  let lastPeak = 0, lastClap = 0;

  (function loop() {
    if (id !== listenId || phase !== "listen") return;
    an.getFloatTimeDomainData(buf);
    let peak = 0;
    for (const v of buf) peak = Math.max(peak, Math.abs(v));
    $("level").style.width = Math.min(100, peak * 100) + "%";
    const now = performance.now();
    if (peak > threshold && now - lastPeak > DEBOUNCE) {
      lastPeak = now;
      if (now - lastClap > MIN_GAP && now - lastClap < MAX_GAP) { playSong(); return; }
      lastClap = now;
      ring.className = "active";
      setTimeout(() => { if (phase === "listen") ring.className = ""; }, 300);
    }
    requestAnimationFrame(loop);
  })();
}

function stopMic() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (src) src.disconnect();
  stream = src = null;
}

function playSong() {
  phase = "play";
  stopMic();               // Mikro aus, sonst schickt iOS den Ton an den Hörer
  setSession("playback");  // ... und zurück auf den Lautsprecher
  $("level").style.width = "0";
  ring.className = "play";
  statusEl.textContent = "🎶 Willkommen zuhause, Sir.";
  hint.textContent = "Tippe auf den Ring zum Stoppen";
  song.currentTime = 0;
  song.play().catch(() => {
    hint.textContent = "Abspielen blockiert – tippe auf den Ring";
  });
}

// Nach dem Zurückkehren in die Seite: Display-Sperre und Mikro neu holen
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  keepAwake();
  if (phase === "listen") {
    const dead = !stream || stream.getTracks().every(t => t.readyState !== "live");
    if (dead) { stopMic(); startListening(); }
  }
});
</script>
</body>
</html>
